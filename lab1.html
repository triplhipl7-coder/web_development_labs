<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №1</title>
</head>
<body>
    <!-- Посилання назад на головну сторінку для зручності -->
    <a href="index.html">Повернутися до списку лабораторних</a>
    
    <h2>Форма реєстрації</h2>

    <!-- Форма. Атрибут action вказує куди відправляти дані -->
    <form action="https://webhook.site/0a30fb50-c199-40d0-834d-5a5d988ddd25" method="POST">
        <!-- Поле: Ім'я (обов'язкове) -->
        <div>
            <label for="firstName">Ім'я користувача:</label><br>
            <input type="text" id="firstName" name="first_name" required>
        </div>
        <br>

        <!-- Поле: Прізвище (обов'язкове) -->
        <div>
            <label for="lastName">Прізвище користувача:</label><br>
            <input type="text" id="lastName" name="last_name" required>
        </div>
        <br>

        <!-- Поле: Email (обов'язкове) -->
        <div>
            <label for="userEmail">Електронна пошта:</label><br>
            <input type="email" id="userEmail" name="email" required>
        </div>
        <br>

        <!-- Поле: Пароль (обов'язкове) -->
        <div>
            <label for="userPassword">Пароль:</label><br>
            <input type="password" id="userPassword" name="password" required>
        </div>
        <br>

        <!-- Поле: Підтвердження паролю -->
        <div>
            <label for="confirmPassword">Підтвердження паролю:</label><br>
            <input type="password" id="confirmPassword" name="password_confirmation">
        </div>
        <br>

        <!-- Додаткове поле 1: Дата народження -->
        <div>
            <label for="birthDate">Дата народження:</label><br>
            <input type="date" id="birthDate" name="birth_date">
        </div>
        <br>

        <!-- Додаткове поле 2: Стать -->
        <div>
            <label for="userGender">Стать:</label><br>
            <select id="userGender" name="gender">
                <option value="male">Чоловіча</option>
                <option value="female">Жіноча</option>
                <option value="other">Інше</option>
            </select>
        </div>
        <br>

        <!-- Кнопка відправки -->
        <div>
            <input type="submit" value="Зареєструватися">
        </div>

    </form>

</body>
</html>
